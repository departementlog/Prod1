<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Marhba bik - Moroccan Style</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Amiri', serif;
      background-color: #fdf6e3;
      background-image: url('https://www.transparenttextures.com/patterns/arabesque.png');
      color: #2c2c2c;
      text-align: center;
    }

    header {
      background-color: #c1272d; /* Moroccan red */
      padding: 2rem;
      color: white;
      border-bottom: 5px solid #f9bf3b;
    }

    h1 {
      font-size: 3rem;
      margin: 0;
    }

    .tagline {
      font-size: 1.5rem;
      color: #f9bf3b;
      margin-top: 0.5rem;
    }

    section {
      padding: 2rem;
    }

    .btn {
      display: inline-block;
      padding: 1rem 2rem;
      background-color: #007a3d; /* Moroccan green */
      color: white;
      text-decoration: none;
      border-radius: 5px;
      margin-top: 2rem;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    .btn:hover {
      background-color: #005f2f;
    }

    footer {
      margin-top: 3rem;
      background-color: #eee;
      padding: 1rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>🇲🇦 Marhba Bik!</h1>
    <p class="tagline">مرحبا بك فالموقع ديالنا</p>
  </header>

  <section>
    <p>Hadi ghir page test, mais b style dyal lblad 🔥</p>
    <a href="#" class="btn">Dkhol L Site</a>
  </section>

  <footer>
    &copy; 2025 Made with ❤️ in Morocco
  </footer>
</body>
</html>
